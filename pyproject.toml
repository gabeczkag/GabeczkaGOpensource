[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gabeczka-forge"
version = "0.1.0"
description = "Training pipeline for the Gabeczka Forge language model"
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]